[package]
name = "novel-manager"
version = "3.2.0"
description = "小说数据管理器"
authors = ["NovelManager"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "novel_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
# 使用 unwind 以便 panic hook 捕获崩溃并写入日志文件
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
