<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>小说数据管理器</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/manifest.json">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航 -->
        <header class="app-header">
            <h1>📖 小说数据管理器</h1>
            <button class="btn-save" onclick="alert('inline test works!')">💾 保存</button>
        </header>

        <!-- 主内容区 -->
                <main class="app-content">
            <!-- 角色页面 -->
            <div class="page-section active" id="page-character">
                <section class="card character-card">
                    <div class="card-header">
                        <h2>👤 角色信息</h2>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn-small" onclick="exportModule('character')">📄 导出</button>
                            <button class="btn-small" onclick="showEditCharacterMain()">✏️ 编辑</button>
                        </div>
                    </div>
                    <div class="card-body" id="character-info">
                        <div class="loading">加载中...</div>
                    </div>
                </section>
            </div>

            <!-- 货币页面 -->
            <div class="page-section" id="page-currency">
                <section class="card currency-card">
                    <div class="card-header">
                        <h2>💰 货币</h2>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn-small" onclick="exportModule('currency')">📄 导出</button>
                            <button class="btn-small" onclick="showAddCurrencyType()">+ 添加</button>
                        </div>
                    </div>
                    <div class="card-body" id="currency-info">
                        <div class="loading">加载中...</div>
                    </div>
                </section>
            </div>

            <!-- 背包页面 -->
            <div class="page-section" id="page-inventory">
                <section class="card">
                    <div class="tab-actions">
                        <button class="btn-primary" onclick="showAddItem()">+ 添加物品</button>
                        <button class="btn-secondary" onclick="exportModule('inventory')">📤 导出</button>
                    </div>
                    <div class="item-list" id="inventory-list">
                        <div class="loading">加载中...</div>
                    </div>
                </section>
            </div>

            <!-- 装备页面 -->
            <div class="page-section" id="page-equipment">
                <section class="card">
                    <div class="tab-actions">
                        <button class="btn-secondary" onclick="showSlotManager()">⚙️ 管理装备槽位</button>
                        <button class="btn-secondary" onclick="exportModule('equipment')">📤 导出</button>
                    </div>
                    <div class="equipment-grid" id="equipment-grid">
                        <div class="loading">加载中...</div>
                    </div>
                </section>
            </div>


            <!-- 物品库页面 -->
            <div class="page-section" id="page-item-library">
                <section class="card">
                    <!-- 分类选择栏 -->
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0;">
                        <button class="btn-secondary btn-small" onclick="showItemCategorySelector()" id="current-category-btn">
                            <span id="current-category-icon">📁</span>
                            <span id="current-category-name">全部分类</span>
                            <span style="margin-left: 4px;">▼</span>
                        </button>
                        <button class="btn-small" onclick="showItemCategoryManager()" title="管理分类">⚙️ 分类管理</button>
                        <div style="flex: 1;"></div>
                        <button class="btn-secondary btn-small" onclick="exportModule('item_library')">📤 导出</button>
                        <button class="btn-primary btn-small" onclick="showAddLibraryItem()">+ 添加物品</button>
                    </div>
                    
                    <!-- 分类选择下拉面板（默认隐藏） -->
                    <div id="category-selector-panel" style="display: none; margin-bottom: 12px; padding: 8px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <div id="category-selector-list" style="display: flex; flex-wrap: wrap; gap: 6px;">
                            <!-- 分类列表动态生成 -->
                        </div>
                    </div>
                    
                    <!-- 物品列表 -->
                    <div class="item-list" id="library-item-list">
                        <div class="loading">加载中...</div>
                    </div>
                </section>
            </div>
            <!-- 任务页面 -->
            <div class="page-section" id="page-quests">
                <section class="card">
                    <div class="tab-actions">
                        <button class="btn-secondary" onclick="exportModule('quests')">📄 导出</button>
                        <button class="btn-primary" onclick="showAddCustomQuest()">+ 添加任务</button>
                    </div>
                    <div class="quest-list" id="quest-list">
                        <div class="loading">加载中...</div>
                    </div>
                </section>
            </div>

            <!-- 技能页面 -->
            <div class="page-section" id="page-skills">
                <section class="card">
                    <div class="tab-actions">
                        <button class="btn-secondary" onclick="exportModule('skills')">📄 导出</button>
                        <!-- <button class="btn-primary" onclick="showAddCustomSkill()">+ 添加技能</button> -->
                    </div>
                    <div class="skill-list" id="skill-list">
                        <div class="loading">加载中...</div>
                    </div>
                </section>
            </div>

            <!-- 剧情页面 -->
            <div class="page-section" id="page-story">
                <section class="card">
                    <div class="story-section">
                        <h3>📍 剧情标记</h3>
                        <div class="tab-actions">
                            <button class="btn-small" onclick="exportModule('story')">📄 导出</button>
                            <button class="btn-small" onclick="showAddStoryMark()">+ 添加标记</button>
                        </div>
                        <div class="story-list" id="story-marks">
                            <div class="loading">加载中...</div>
                        </div>
                    </div>
                    <div class="story-section">
                        <h3>🌱 伏笔管理</h3>
                        <div class="tab-actions">
                            <button class="btn-small" onclick="showAddForeshadowing()">+ 埋设伏笔</button>
                        </div>
                        <div class="foreshadowing-list" id="foreshadowing-list">
                            <div class="loading">加载中...</div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- 地图页面 -->
            <div class="page-section" id="page-map">
                <section class="card">
                    <div class="card-header">
                        <h2>🗺️ 地图管理</h2>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn-small" onclick="exportModule('locations')">📄 导出</button>
                            <button class="btn-small" onclick="showAddLocation()">+ 添加地点</button>
                        </div>
                    </div>
                    <div class="location-list" id="location-list">
                        <div class="loading">加载中...</div>
                    </div>
                </section>
            </div>
            <!-- 关系页面 -->
            <div class="page-section" id="page-relation">
                <section class="card">
                    <div class="relation-header">
                        <div class="relation-title">
                            <h2>👥 人物关系</h2>
                        </div>
                        <div class="relation-actions">
                            <button class="btn-primary" onclick="showAddCharacter()">+ 添加人物</button>
                            <button class="btn-secondary" onclick="showManageRelationTypes()">⚙️ 关系类型</button>
                        </div>
                    </div>
                    <div class="relation-toolbar">
                        <div class="character-filter">
                            <span>筛选人物：</span>
                            <select id="relation-character-filter" onchange="filterRelationsByCharacter()">
                                <option value="">全部人物</option>
                            </select>
                        </div>
                        <div class="view-toggle">
                            <button class="view-btn active" id="view-list-btn" onclick="switchRelationView('list')">📋 列表</button>
                            <button class="view-btn" id="view-network-btn" onclick="switchRelationView('network')">🕸️ 网络</button>
                        </div>
                    </div>
                    <!-- 列表模式 -->
                    <div class="relation-list-view" id="relation-list-view">
                        <div class="character-list" id="character-list">
                            <div class="loading">加载中...</div>
                        </div>
                    </div>
                    <!-- 网络模式 -->
                    <div class="relation-network-view" id="relation-network-view" style="display:none;">
                        <div class="network-controls">
                            <button class="btn-small" onclick="zoomInNetwork()">🔍+ 放大</button>
                            <button class="btn-small" onclick="zoomOutNetwork()">🔍- 缩小</button>
                            <button class="btn-small" onclick="resetNetworkView()">↺ 重置</button>
                            <span class="zoom-level" id="network-zoom-level">100%</span>
                        </div>
                        <div class="network-container" id="network-container">
                            <svg id="network-svg" width="100%" height="500"></svg>
                        </div>
                    </div>
                </section>
            </div>
            <!-- 自定义数据页面 -->
            <div class="page-section" id="page-custom">
                <section class="card">
                    <div class="custom-sidebar">
                        <div class="sidebar-header">
                            <h3>📋 数据分类</h3>
                            <button class="btn-small" onclick="showAddCategory()">+ 新建</button>
                        </div>
                        <div class="category-list" id="category-list">
                            <div class="loading">加载中...</div>
                        </div>
                    </div>
                    <div class="custom-content">
                        <div class="content-header">
                            <h3 id="current-category-title">选择一个分类</h3>
                            <div style="display: flex; gap: 8px;">
                                <button class="btn-secondary" id="export-custom-btn" onclick="showCustomExport()" style="display:none;">📤 导出</button>
                                <button class="btn-primary" id="add-item-btn" onclick="showAddCustomItem()" style="display:none;">+ 添加条目</button>
                            </div>
                        </div>
                        <div class="custom-item-list" id="custom-item-list">
                            <div class="empty-state">
                                <p>请从上方选择一个分类</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- 数据预览页面 -->
            <div class="page-section" id="page-preview">
                <section class="card">
                    <div class="card-header">
                        <h2>📊 数据预览</h2>
                        <span class="card-subtitle">所有模块数据汇总（只读）</span>
                    </div>
                    <div id="preview-data" class="preview-container">
                        <div class="loading">加载中...</div>
                    </div>
                </section>
            </div>

            <!-- 工具页面 -->
            <div class="page-section" id="page-tools">
                <section class="card">
                    <div class="tool-section">
                        <h3>🔍 全局搜索</h3>
                        <div class="search-box">
                            <input type="text" id="search-input" placeholder="输入关键词搜索...">
                            <button onclick="doSearch()">搜索</button>
                        </div>
                        <div class="search-results" id="search-results"></div>
                    </div>
                    <div class="tool-section">
                        <h3>💾 数据管理</h3>
                        <div class="action-buttons">
                            <button class="btn-primary" onclick="createBackup()">创建备份</button>
                            <button class="btn-secondary" onclick="alert('inline test works!')">保存数据</button>
                            <button class="btn-secondary" onclick="clearBackups()" style="background: #ef4444; border-color: #ef4444;">清理全部备份</button>
                        </div>
                        <div id="backup-result"></div>
                    </div>
                    
                    <div class="tool-section">
                        <h3>📤 数据导出</h3>
                        <div class="action-buttons">
                            <button class="btn-primary" onclick="exportToTxt()">📄 一键导出TXT</button>
                            <button class="btn-secondary" onclick="showExportOrder()">⚙️ 导出设置</button>
                        </div>
                        <div id="export-result"></div>
                    </div>
                    <div class="tool-section">
                        <h3>🔘 按钮设置</h3>
                        <div class="action-buttons">
                            <button class="btn-primary" onclick="showButtonSettings()">⚙️ 按钮重命名与排序</button>
                        </div>
                    </div>
                    
                    <div class="tool-section">
                        <h3>🎨 主题设置</h3>
                        <div class="action-buttons">
                            <button class="btn-primary" onclick="showThemeSettings()">🎨 切换主题</button>
                        </div>
                    </div>
                    <div class="tool-section">
                        <h3>📝 版本更新</h3>
                        <div class="action-buttons">
                            <button class="btn-primary" onclick="showVersionHistory()">📋 查看更新日志</button>
                        </div>
                        <div style="margin-top: 8px; font-size: 12px; color: #64748b;">
                            当前版本：v3.1.0
                        </div>
                    </div>
                </section>
            </div>
        </main>

                <!-- 底部导航（移动端） -->
        <nav class="bottom-nav" id="bottom-nav">
            <button class="nav-btn active" data-page="character">
                <span class="nav-icon">👤</span>
                <span class="nav-label">角色</span>
            </button>
            <button class="nav-btn" data-page="currency">
                <span class="nav-icon">💰</span>
                <span class="nav-label">货币</span>
            </button>
            <button class="nav-btn" data-page="inventory">
                <span class="nav-icon">🎒</span>
                <span class="nav-label">背包</span>
            </button>
            <button class="nav-btn" data-page="item-library">
                <span class="nav-icon">📦</span>
                <span class="nav-label">物品库</span>
            </button>
            <button class="nav-btn" data-page="equipment">
                <span class="nav-icon">⚔️</span>
                <span class="nav-label">装备</span>
            </button>
            <button class="nav-btn" data-page="quests">
                <span class="nav-icon">📜</span>
                <span class="nav-label">任务</span>
            </button>
            <button class="nav-btn" data-page="skills">
                <span class="nav-icon">✨</span>
                <span class="nav-label">技能</span>
            </button>
            <button class="nav-btn" data-page="story">
                <span class="nav-icon">📖</span>
                <span class="nav-label">剧情</span>
            </button>
            <button class="nav-btn" data-page="map">
                <span class="nav-icon">🗺️</span>
                <span class="nav-label">地图</span>
            </button>
            <button class="nav-btn" data-page="relation">
                <span class="nav-icon">👥</span>
                <span class="nav-label">关系</span>
            </button>
            <button class="nav-btn" data-page="custom">
                <span class="nav-icon">📋</span>
                <span class="nav-label">自定义</span>
            </button>
            <button class="nav-btn" data-page="preview">
                <span class="nav-icon">📊</span>
                <span class="nav-label">数据预览</span>
            </button>
            <button class="nav-btn" data-page="tools">
                <span class="nav-icon">🔧</span>
                <span class="nav-label">工具</span>
            </button>
        </nav>
    </div>

    <!-- 弹窗容器 -->
    <div id="modal-container"></div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <script src="/static/js/app.js?v=20260622_v9_final_fixed"></script>
    <script src="/static/js/custom_features.js?v=20260622_fixed_v9_final2"></script>
    <script src="/static/js/advanced_features.js?v=20260622_fixed_v9_final2"></script>
    <script src="/static/js/v183_features.js?v=20260622_fixed_v9_final2"></script>
</body>
</html>
